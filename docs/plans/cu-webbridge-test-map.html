<script>
(() => {
  const STORE_KEY = 'cu-webbridge-test-map:v1';
  const CHECK_PREFIX = 'M6 5a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1z';
  const state = new Map(JSON.parse(localStorage.getItem(STORE_KEY) || '[]'));

  const bar = document.createElement('div');
  bar.style.cssText = 'position:fixed;top:10px;left:10px;z-index:99;background:#fff;border:1px solid #ccc;border-radius:8px;padding:6px 12px;font:13px ui-sans-serif,system-ui;box-shadow:0 1px 4px rgba(0,0,0,.15);user-select:none;';
  document.body.appendChild(bar);

  const keyOf = (box) => 'k:' + (box.textContent || '').trim().slice(0, 80);
  const save = () => localStorage.setItem(STORE_KEY, JSON.stringify([...state.entries()]));
  const boxes = () => [...document.querySelectorAll('svg#mindmap svg path')].filter(p => (p.getAttribute('d') || '').startsWith(CHECK_PREFIX)).map(p => p.closest('svg'));

  function applyOne(svg) {
    const box = svg.closest('div');
    const on = state.get(keyOf(box)) === true;
    box.style.opacity = on ? '0.45' : '';
    if (on) {
      if (!svg.dataset.checked) {
        svg.dataset.orig = svg.innerHTML;
        svg.innerHTML = '<text x="1" y="16" font-size="18" fill="#4EC87E" style="font-weight:bold">✓</text>';
        svg.dataset.checked = '1';
      }
    } else if (svg.dataset.checked) {
      svg.innerHTML = svg.dataset.orig;
      delete svg.dataset.checked;
    }
  }
  function applyAll() {
    const svgs = boxes();
    svgs.forEach(applyOne);
    const done = svgs.filter(s => state.get(keyOf(s.closest('div'))) === true).length;
    bar.textContent = done + ' / ' + svgs.length + ' 完成（点击复选框打勾）';
  }

  document.addEventListener('click', (e) => {
    const p = e.target.closest && e.target.closest('path');
    if (!p || !(p.getAttribute('d') || '').startsWith(CHECK_PREFIX)) return;
    const svg = p.closest('svg');
    const box = svg && svg.closest('div');
    if (!svg || !box) return;
    const key = keyOf(box);
    state.set(key, state.get(key) !== true);
    save();
    applyAll();
    e.stopPropagation();
    e.preventDefault();
  }, true);

  new MutationObserver(() => applyAll()).observe(document.getElementById('mindmap'), { childList: true, subtree: true });

  const t = setInterval(() => { if (boxes().length) { applyAll(); clearInterval(t); } }, 300);
  setTimeout(() => clearInterval(t), 15000);
})();

</script>
