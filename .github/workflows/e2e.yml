name: E2E

# Every push to main runs the suite. A pull request runs it only when it is
# ready for review and either carries the e2e label or changes the suite
# itself, so the shared runner pool is not spent on every push of every PR.
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]

permissions:
  contents: read

# Each main commit gets its own group so every merge is tested. Adding an
# unrelated label gets a throwaway group so it cannot cancel a running suite.
concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'push' && github.sha || (github.event.action == 'labeled' && github.event.label.name != 'e2e') && github.run_id || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    name: Decide whether E2E runs
    if: >-
      github.event_name != 'pull_request' ||
      (!github.event.pull_request.draft &&
       (github.event.action != 'labeled' || github.event.label.name == 'e2e'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - id: decide
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'e2e') }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" != pull_request || "$HAS_LABEL" == true ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh api --paginate "repos/$REPO/pulls/$PR/files?per_page=100" --jq '.[].filename')
          if grep -qE '^(tests/e2e/|packages/testkit/|\.github/workflows/e2e\.yml$)' <<<"$files"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "E2E skipped: this pull request does not change the E2E suite. Add the \`e2e\` label to run it." >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    name: Build (optional)
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - uses: actions/upload-artifact@v7
        with:
          name: e2e-cli
          path: |
            apps/kimi-code/dist/
            apps/kimi-code/dist-web/
            apps/kimi-code/native/
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v7
        with:
          name: e2e-desktop
          path: |
            apps/desktop/out/
            apps/desktop/desktop-dist/
          if-no-files-found: error
          retention-days: 1

  tui:
    name: TUI (optional)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: e2e-cli
          path: apps/kimi-code
      - name: Run the scenarios and driver self-tests on the TUI
        run: pnpm --filter @moonshot-ai/e2e exec playwright test --project=tui
        env:
          TESTKIT_CLI_BUILD: dist
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: e2e-tui-report
          path: tests/e2e/playwright-report/
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-tui-failure
          path: tests/e2e/test-results/
          retention-days: 7

  acp:
    name: ACP (optional)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: e2e-cli
          path: apps/kimi-code
      - name: Run the scenarios and driver self-tests over ACP
        run: pnpm --filter @moonshot-ai/e2e exec playwright test --project=acp
        env:
          TESTKIT_CLI_BUILD: dist
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: e2e-acp-report
          path: tests/e2e/playwright-report/
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-acp-failure
          path: tests/e2e/test-results/
          retention-days: 7

  desktop:
    name: Desktop (optional)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: e2e-desktop
          path: apps/desktop
      - name: Install a virtual display and the libraries Electron needs
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0 libgbm1 libasound2t64
      - name: Run the scenarios and driver self-tests on Desktop
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" pnpm --filter @moonshot-ai/e2e exec playwright test --project=desktop --workers=1
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: e2e-desktop-report
          path: tests/e2e/playwright-report/
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-desktop-failure
          path: tests/e2e/test-results/
          retention-days: 7

  web:
    name: Web (optional)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: e2e-cli
          path: apps/kimi-code
      - name: Install the browser the Web scenarios run in
        run: pnpm --filter @moonshot-ai/e2e exec playwright install --with-deps chromium
      - name: Run the scenarios and driver self-tests on the Web interface
        run: pnpm --filter @moonshot-ai/e2e exec playwright test --project=web
        env:
          TESTKIT_CLI_BUILD: dist
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: e2e-web-report
          path: tests/e2e/playwright-report/
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-web-failure
          path: tests/e2e/test-results/
          retention-days: 7
