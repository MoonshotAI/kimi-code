name: E2E

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (optional)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - uses: actions/upload-artifact@v7
        with:
          name: e2e-cli
          path: |
            apps/kimi-code/dist/
            apps/kimi-code/dist-web/
            apps/kimi-code/native/
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v7
        with:
          name: e2e-desktop
          path: |
            apps/desktop/out/
            apps/desktop/desktop-dist/
          if-no-files-found: error
          retention-days: 1

  tui:
    name: TUI (optional)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: e2e-cli
          path: apps/kimi-code
      - name: Run the scenarios and driver self-tests on the TUI
        run: pnpm --filter @moonshot-ai/e2e exec playwright test --project=tui
        env:
          TESTKIT_CLI_BUILD: dist
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: e2e-tui-report
          path: tests/e2e/playwright-report/
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-tui-failure
          path: tests/e2e/test-results/
          retention-days: 7

  acp:
    name: ACP (optional)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: e2e-cli
          path: apps/kimi-code
      - name: Run the scenarios and driver self-tests over ACP
        run: pnpm --filter @moonshot-ai/e2e exec playwright test --project=acp
        env:
          TESTKIT_CLI_BUILD: dist
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: e2e-acp-report
          path: tests/e2e/playwright-report/
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-acp-failure
          path: tests/e2e/test-results/
          retention-days: 7

  desktop:
    name: Desktop (optional, ${{ matrix.shard }}/2)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: e2e-desktop
          path: apps/desktop
      - name: Install a virtual display and the libraries Electron needs
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0 libgbm1 libasound2t64
      - name: Download the Electron binary before parallel cases start it
        run: pnpm --filter kimi-code-app exec node -e "require('electron')"
      - name: Run the scenarios and driver self-tests on Desktop
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" pnpm --filter @moonshot-ai/e2e exec playwright test --project=desktop --shard=${{ matrix.shard }}/2
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: e2e-desktop-report-${{ matrix.shard }}
          path: tests/e2e/playwright-report/
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-desktop-failure-${{ matrix.shard }}
          path: tests/e2e/test-results/
          retention-days: 7

  web:
    name: Web (optional, ${{ matrix.shard }}/2)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: e2e-cli
          path: apps/kimi-code
      - name: Install the browser the Web scenarios run in
        run: pnpm --filter @moonshot-ai/e2e exec playwright install --with-deps chromium
      - name: Run the scenarios and driver self-tests on the Web interface
        run: pnpm --filter @moonshot-ai/e2e exec playwright test --project=web --shard=${{ matrix.shard }}/2
        env:
          TESTKIT_CLI_BUILD: dist
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: e2e-web-report-${{ matrix.shard }}
          path: tests/e2e/playwright-report/
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-web-failure-${{ matrix.shard }}
          path: tests/e2e/test-results/
          retention-days: 7

  windows:
    name: Windows ${{ matrix.surface }} (manual)
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: build
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        surface: [tui, acp, desktop, web]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: e2e-cli
          path: apps/kimi-code
      - uses: actions/download-artifact@v8
        if: ${{ matrix.surface == 'desktop' }}
        with:
          name: e2e-desktop
          path: apps/desktop
      - name: Download the Electron binary before parallel cases start it
        if: ${{ matrix.surface == 'desktop' }}
        run: pnpm --filter kimi-code-app exec node -e "require('electron')"
      - name: Install the browser the Web scenarios run in
        if: ${{ matrix.surface == 'web' }}
        run: pnpm --filter @moonshot-ai/e2e exec playwright install chromium
      - name: Run the scenarios and driver self-tests on Windows
        run: pnpm --filter @moonshot-ai/e2e exec playwright test --project=${{ matrix.surface }}
        env:
          TESTKIT_CLI_BUILD: dist
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: e2e-windows-${{ matrix.surface }}-report
          path: tests/e2e/playwright-report/
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-windows-${{ matrix.surface }}-failure
          path: tests/e2e/test-results/
          retention-days: 7
