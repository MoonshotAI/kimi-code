name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'release/*'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ startsWith(github.ref, 'refs/heads/release/') && github.sha || '' }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/heads/release/') }}

jobs:
  release-workflow-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: node --test scripts/release.test.mjs scripts/release-trigger.test.mjs scripts/canary-release.test.mjs scripts/desktop-nightly-guard.test.mjs

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Check for generated declarations in agent-core-v2 source and tests
        shell: bash
        run: |
          declarations=$(git status --porcelain=v1 --untracked-files=all --ignored=matching -- \
            ':(glob)packages/agent-core-v2/src/**/*.d.ts' \
            ':(glob)packages/agent-core-v2/src/**/*.d.[cm]ts' \
            ':(glob)packages/agent-core-v2/test/**/*.d.ts' \
            ':(glob)packages/agent-core-v2/test/**/*.d.[cm]ts')
          if [ -n "$declarations" ]; then
            printf 'Unexpected declarations in agent-core-v2 source and tests:\n%s\n' "$declarations"
            exit 1
          fi
      - name: Smoke test CLI bundle
        run: pnpm -C apps/kimi-code run smoke
      # Temporarily disabled while the E2E suite is being replaced.
      - name: Run the TUI and KAP subprocess journeys on the built CLI
        if: false
        run: pnpm exec vitest run apps/kimi-code/test/e2e/tui tests/scenarios/cold-recovery.test.ts
        env:
          TESTKIT_CLI_BUILD: dist
      - name: Save CLI Web assets for the tested release commit
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')
        uses: actions/upload-artifact@v7
        with:
          name: cli-web-${{ github.sha }}
          path: apps/kimi-code/dist-web/
          if-no-files-found: error
          retention-days: 7
          overwrite: true
      - name: Save the Desktop renderer for the tested release commit
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')
        uses: actions/upload-artifact@v7
        with:
          name: desktop-renderer-${{ github.sha }}
          path: apps/desktop/desktop-dist/
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # Keep the KAP server suite and every tests/scenarios case in these shards.
      - run: pnpm run test --shard=${{ matrix.shard }}/5 --exclude='**/test/e2e/tui/**' --exclude='**/test/reconnect/**' --reporter=default --reporter=github-actions --reporter=./scripts/vitest-l0-gate.mjs
        env:
          KIMI_L0_RESULTS: .vitest-reports/l0-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: l0-results-${{ matrix.shard }}
          path: .vitest-reports/l0-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 3

  # Every L0 test in tests/protected.yaml must pass on its first attempt in
  # the sharded run above, whatever its kind (smoke, regression, contract).
  # Temporarily disabled while the E2E suite is being replaced.
  l0-gate:
    name: L0 protected tests
    needs: test
    if: ${{ !cancelled() && false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Include L0 IDs protected on the base revision
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git cat-file -e "$BASE_SHA^{commit}" || git fetch --no-tags --depth=1 origin "$BASE_SHA"
          entry=$(git ls-tree "$BASE_SHA" -- tests/protected.yaml)
          if [[ -n "$entry" ]]; then
            git show "${BASE_SHA}:tests/protected.yaml" > "$RUNNER_TEMP/l0-base.yaml"
            echo "KIMI_L0_BASE_MANIFEST=$RUNNER_TEMP/l0-base.yaml" >> "$GITHUB_ENV"
          fi

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: node --test scripts/protected-smoke.test.mjs
      - uses: actions/download-artifact@v8
        with:
          pattern: l0-results-*
          path: .vitest-reports
          merge-multiple: true
      - name: Check every L0 test in the shard results
        run: node scripts/vitest-l0-gate.mjs .vitest-reports

  # pi-tui's suite runs on node:test (not vitest), so the root `pnpm run test`
  # does not execute it; it needs its own job.
  test-pi-tui:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @moonshot-ai/pi-tui test

  # The VS Code extension suite runs on the default (v2) engine as part of the
  # sharded root run above; this job reruns it on the legacy v1 engine, which
  # the extension selects through the rollback env var.
  test-vscode-legacy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter kimi-code test
        env:
          KIMI_CODE_LEGACY_FLAG: "1"

  test-windows:
    runs-on: windows-latest
    # Temporarily disabled while Windows tests are being stabilized.
    if: false

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # Windows runners are slower and run the whole suite (including
      # in-process e2e tests) under more contention, so the default 5s test
      # timeout causes flaky failures. Give it more headroom.
      - run: pnpm run test -- --testTimeout=30000

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: node --test 'scripts/checks/*.test.mjs'
      - run: node --test scripts/check-comments.test.mjs
      - run: node --test scripts/desktop-artifact-prefix.test.mjs scripts/canary-version.test.mjs scripts/desktop-canary-publish.test.mjs scripts/canary-linux.test.mjs scripts/mac-update-minimum-system-version.test.mjs scripts/mutation-diff.test.mjs apps/desktop/scripts/ci/select-e2e-specs.test.mjs apps/desktop/scripts/ci/report-main-journeys.test.mjs
      - run: pnpm run sherif
      - name: Check new code duplication
        id: duplication
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          pnpm run check:duplication "$BASE_SHA"
      - name: Show new duplicate locations
        if: failure() && steps.duplication.outcome == 'failure' && hashFiles('.tmp/jscpd/jscpd-report.json') != ''
        run: |
          jq -r '.duplicates[] | select(.isNew) |
            "\(.firstFile.name):\(.firstFile.start) and \(.secondFile.name):\(.secondFile.start) (\(.lines) lines, \(.tokens) tokens)"
          ' .tmp/jscpd/jscpd-report.json

  typecheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: |
          pnpm exec tsc --version
          for config in packages/*/tsconfig.json apps/kimi-code/tsconfig.json tests/scenarios/tsconfig.json tests/e2e/tsconfig.json; do
            # Source-only app packages are typechecked through the desktop
            # renderer program below, not standalone under the root tsc setup.
            case "${config}" in
              packages/app-*/tsconfig.json) continue ;;
            esac
            echo "Typechecking ${config}"
            pnpm exec tsc -p "${config}" --noEmit
          done
      - name: Typecheck desktop
        run: pnpm --filter kimi-code-app run typecheck
      - name: Typecheck VS Code extension
        run: pnpm --filter kimi-code run typecheck
      - name: Typecheck vis-server
        run: pnpm --filter @moonshot-ai/vis-server run typecheck
      - name: Typecheck vis-web
        run: pnpm --filter @moonshot-ai/vis-web run typecheck
