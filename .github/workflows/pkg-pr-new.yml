name: pkg.pr.new

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  publish:
    name: Publish Kimi Code preview
    runs-on: ubuntu-latest
    if: github.repository_owner == 'MoonshotAI' && github.event.pull_request.draft == false

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package dependencies
        run: pnpm run build:packages

      - name: Generate Kimi Code built-in catalog
        shell: bash
        run: |
          CATALOG_FILE="$RUNNER_TEMP/kimi-code-built-in-catalog.json"
          node apps/kimi-code/scripts/update-catalog.mjs --out "$CATALOG_FILE"
          echo "KIMI_CODE_BUILT_IN_CATALOG_FILE=$CATALOG_FILE" >> "$GITHUB_ENV"

      - name: Build Kimi Code package
        run: pnpm --filter @moonshot-ai/kimi-code run build

      - name: Publish pkg.pr.new preview
        run: pnpm exec pkg-pr-new publish --comment=off --json pkg-pr-new-output.json --no-template './apps/kimi-code'

      - name: Post or update PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- pkg-pr-new-preview-bot -->';
            const output = JSON.parse(fs.readFileSync('pkg-pr-new-output.json', 'utf8'));
            const sha = context.payload.pull_request.head.sha.substring(0, 7);
            const sections = output.packages
              .map((p) =>
                [
                  `#### \`${p.name}\``,
                  '',
                  '```bash',
                  `npx --allow-remote=all ${p.url}`,
                  '```',
                  '',
                  '```bash',
                  `pnpm dlx ${p.url}`,
                  '```',
                ].join('\n'),
              )
              .join('\n');
            const body = [
              marker,
              `### pkg.pr.new preview (\`${sha}\`)`,
              '',
              sections,
              '',
              '> npm 12+ blocks URL installs by default (`EALLOWREMOTE`); `--allow-remote=all` opts back in and is ignored by older npm. pnpm needs no flag.',
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((comment) => comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
