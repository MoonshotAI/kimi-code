name: Release

on:
  push:
    branches: ['release/*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  version:
    if: github.repository_owner == 'MoonshotAI' && startsWith(github.ref, 'refs/heads/release/')
    concurrency:
      group: release-version-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action@v1
        id: version
        with:
          version: pnpm run version:release
          commit: 'ci: release packages'
          title: 'ci: release packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check version PR
        if: steps.version.outputs.pullRequestNumber != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_BRANCH: changeset-release/${{ github.ref_name }}
        run: gh workflow run ci.yml --ref "$VERSION_BRANCH"

  candidate:
    if: github.repository_owner == 'MoonshotAI' && github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: read
      actions: read
      checks: read
    outputs:
      publish: ${{ steps.trigger.outputs.publish }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Wait for merged version commit CI
        id: trigger
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-trigger.mjs

  vscode:
    needs: candidate
    if: needs.candidate.outputs.publish == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/vscode-publish.yml
    secrets:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}

  release:
    needs: candidate
    if: needs.candidate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: core-npm-publish
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
      id-token: write
    outputs:
      complete: ${{ steps.restore.outputs.complete }}
      tag: ${{ steps.restore.outputs.tag }}
    env:
      GH_TOKEN: ${{ github.token }}
      KIMI_CODE_BUILT_IN_CATALOG_FILE: ${{ github.workspace }}/.release-inputs/catalog.json
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@11
      - run: node scripts/core-release.mjs check
      - id: restore
        run: node scripts/core-release.mjs restore
      - if: steps.restore.outputs.complete != 'true' && steps.restore.outputs.ready != 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.restore.outputs.complete != 'true' && steps.restore.outputs.ready != 'true'
        run: node apps/kimi-code/scripts/update-catalog.mjs --out "$KIMI_CODE_BUILT_IN_CATALOG_FILE"
      - if: steps.restore.outputs.complete != 'true' && steps.restore.outputs.ready != 'true'
        run: pnpm build
      - if: steps.restore.outputs.complete != 'true' && steps.restore.outputs.ready != 'true'
        run: node scripts/core-release.mjs snapshot
      - if: steps.restore.outputs.complete != 'true'
        run: node scripts/core-release.mjs npm

  native-artifacts:
    needs: release
    if: needs.release.outputs.complete != 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/_native-build.yml
    with:
      upload-artifact-prefix: kimi-code-native
      retention-days: 7
      sign-macos: true
      sign-windows: true
      release-inputs: true
    secrets:
      APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_NOTARIZATION_KEY_P8: ${{ secrets.APPLE_NOTARIZATION_KEY_P8 }}
      APPLE_NOTARIZATION_KEY_ID: ${{ secrets.APPLE_NOTARIZATION_KEY_ID }}
      APPLE_NOTARIZATION_ISSUER_ID: ${{ secrets.APPLE_NOTARIZATION_ISSUER_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

  publish-native-assets:
    needs: [release, native-artifacts]
    if: always() && needs.release.result == 'success' && needs.release.outputs.complete != 'true' && needs.native-artifacts.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v8
        with:
          pattern: kimi-code-native-*
          path: dist-native-release
          merge-multiple: true
      - name: Produce native manifest
        env:
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: node apps/kimi-code/scripts/native/produce-manifest.mjs dist-native-release "$RELEASE_TAG"
      - run: node scripts/core-release.mjs finish dist-native-release

  deploy-docs:
    needs: publish-native-assets
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Deploy existing main documentation
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run docs-deploy.yml --ref main
