name: Release

on:
  push:
    branches: ['release/*']
  workflow_dispatch:
    inputs:
      operation:
        description: Prepare the version PR or publish a tested commit
        type: choice
        options: [prepare, publish]
        default: prepare
        required: true
      expected_sha:
        description: Full tested commit SHA (required for publish)
        type: string
        required: false

concurrency:
  group: release-${{ inputs.operation == 'publish' && 'publish' || github.ref }}
  cancel-in-progress: false

jobs:
  version:
    if: github.repository_owner == 'MoonshotAI' && startsWith(github.ref, 'refs/heads/release/') && (github.event_name == 'push' || inputs.operation == 'prepare')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action@v1
        id: version
        with:
          version: node scripts/version-release.mjs
          commit: "ci: release packages"
          title: "ci: release packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check the generated version PR
        if: steps.version.outputs.pullRequestNumber != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_BRANCH: changeset-release/${{ github.ref_name }}
        run: gh workflow run ci.yml --ref "$VERSION_BRANCH"

  release:
    if: github.repository_owner == 'MoonshotAI' && github.event_name == 'workflow_dispatch' && inputs.operation == 'publish'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      id-token: write
    outputs:
      build: ${{ steps.prepare.outputs.build }}
      tag: ${{ steps.prepare.outputs.tag }}
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_SHA: ${{ inputs.expected_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Verify release branch, plan and tested commit
        run: node scripts/release.mjs check
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Upgrade npm for Trusted Publishing
        run: npm install -g npm@11
      - run: pnpm install --frozen-lockfile
      - name: Generate Kimi Code built-in catalog
        run: |
          CATALOG_FILE="$RUNNER_TEMP/kimi-code-built-in-catalog.json"
          node apps/kimi-code/scripts/update-catalog.mjs --out "$CATALOG_FILE"
          echo "KIMI_CODE_BUILT_IN_CATALOG_FILE=$CATALOG_FILE" >> "$GITHUB_ENV"
      - run: pnpm build
      - name: Prepare draft releases
        id: prepare
        run: node scripts/release.mjs prepare
      - name: Publish npm packages
        if: steps.prepare.outputs.npm == 'true'
        uses: changesets/action@v1
        with:
          publish: pnpm changeset publish
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  native-artifacts:
    name: Native release artifact
    needs: release
    if: needs.release.outputs.build == 'true'
    uses: ./.github/workflows/_native-build.yml
    with:
      upload-artifact-prefix: kimi-code-native
      retention-days: 7
      sign-macos: true
      sign-windows: true
    secrets:
      APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_NOTARIZATION_KEY_P8: ${{ secrets.APPLE_NOTARIZATION_KEY_P8 }}
      APPLE_NOTARIZATION_KEY_ID: ${{ secrets.APPLE_NOTARIZATION_KEY_ID }}
      APPLE_NOTARIZATION_ISSUER_ID: ${{ secrets.APPLE_NOTARIZATION_ISSUER_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

  publish-native-assets:
    name: Publish native release assets
    needs:
      - release
      - native-artifacts
    if: needs.release.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download native artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: kimi-code-native-*
          path: dist-native-release
          merge-multiple: true

      - name: Produce manifest.json
        env:
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: node apps/kimi-code/scripts/native/produce-manifest.mjs dist-native-release "$RELEASE_TAG"

      - name: Upload assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: gh release upload "$RELEASE_TAG" dist-native-release/* --clobber

  complete:
    needs: [release, native-artifacts, publish-native-assets]
    if: always() && needs.release.result == 'success' && (needs.release.outputs.build != 'true' || needs.publish-native-assets.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Publish completed releases
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: node scripts/release.mjs finish
