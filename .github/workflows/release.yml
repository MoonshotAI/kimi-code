name: Release

# 参考 kimi-code 仓库的 release.yml，区别在于本仓不发布 npm——发布物是
# 桌面端安装包，以 GitHub Release 形式分发。
#
# 流程（push 到 main / alpha 时）：
# 1. changesets/action 维护 "ci: release desktop" 版本 PR（有未消费的
#    changeset 时创建 / 更新；没有则跳过）。alpha 分支处于 changeset pre
#    模式，版本 PR 出的是 0.0.x-alpha.N 预发版。
# 2. 版本 PR 合入后，若判定本次 push 改动了 apps/desktop/package.json 的
#    版本号且该版本还没有对应 tag，则调 desktop-build.yml（签名 + 公证）
#    打出四平台安装包，创建 GitHub Release（tag v<version>，notes 自动
#    生成；版本号含 prerelease 段时 --prerelease），并把 dmg / zip / exe /
#    AppImage / deb 以及自动更新元数据（latest*.yml 或 alpha*.yml、
#    *.blockmap）全部上传为该 release 的 assets。
# 3. CDN 分发不在本 workflow：release 就绪后本地执行本仓根目录的
#    ./publish-desktop-cdn.sh <version>（TOS 凭证限内网），把产物同步到
#    CDN 并切换对应通道的更新指针（正式版 latest*.yml / alpha 版 alpha*.yml），
#    客户端自动更新随即生效。
#
# 触发语义：发版只在"版本号被这次 push 改变"（版本 PR 合入，或手动改版本
# 号 = 手动发版）时发生；普通 PR 合入不会改变版本号，不会发版——包括发版
# CI 自身合入、版本基线重置这类 push。
#
# 幂等：tag 已存在则整段跳过；tag 随 gh release create 在最后一步创建，
# 打包失败时不会留下悬空 tag，修复后重跑本 workflow 即可（版本 PR merge
# commit 上版本号仍是"被这次 push 改变"的增量判定，重跑依旧成立）。
on:
  push:
    branches:
      - main
      - alpha

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    if: github.repository_owner == 'MoonshotAI'
    outputs:
      desktop_release: ${{ steps.desktop-release.outputs.should_release }}
      desktop_release_tag: ${{ steps.desktop-release.outputs.tag }}
      desktop_release_sha: ${{ steps.desktop-release.outputs.sha }}
      desktop_release_prerelease: ${{ steps.desktop-release.outputs.prerelease }}
    permissions:
      contents: write # changesets/action 推版本 PR 分支
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create release Pull Request
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
          commit: "ci: release desktop"
          title: "ci: release desktop"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve desktop release
        id: desktop-release
        shell: bash
        run: |
          set -euo pipefail
          # 判定完全基于本次 push 的 SHA，不读工作区：前面的 changesets/action
          # 会把工作区切到 changeset-release 分支（版本已 bump），读工作区会把
          # 版本 PR 未合并期间的每次 push 都误判成"版本变了"，重复触发打包。
          git show "${GITHUB_SHA}:apps/desktop/package.json" > /tmp/desktop-pkg.json
          version=$(node -p "require('/tmp/desktop-pkg.json').version")
          tag="v${version}"
          # 发版 = 版本 PR（ci: release desktop）合入。判定依据：本次 push
          # 改动了桌面版本号（而不是"版本号恰好没有 tag"——发版 CI 自身合入、
          # 手动改版本基线等情况不该触发发版）。版本 PR 之外直接改版本号视为
          # 手动发版，同样放行。
          prev_version=""
          if git show "${GITHUB_SHA}~1:apps/desktop/package.json" > /tmp/prev-desktop-pkg.json 2> /dev/null; then
            prev_version=$(node -p "require('/tmp/prev-desktop-pkg.json').version")
          fi
          if [ "$prev_version" = "$version" ]; then
            echo "desktop version unchanged in this push (${version}) — nothing to release"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code --tags origin "refs/tags/${tag}" > /dev/null 2>&1; then
            echo "tag ${tag} already exists on origin — nothing to release"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            # 版本号含 prerelease 段（0.0.x-alpha.N）即预发版：GH Release 打
            # --prerelease，electron-builder 也已据此把更新元数据命名为
            # alpha*.yml（detectUpdateChannel）。
            prerelease=false
            case "$version" in
              *-*) prerelease=true ;;
            esac
            echo "will release ${tag} at ${GITHUB_SHA} (prerelease=${prerelease})"
            {
              echo "should_release=true"
              echo "tag=${tag}"
              echo "sha=${GITHUB_SHA}"
              echo "prerelease=${prerelease}"
            } >> "$GITHUB_OUTPUT"
          fi

  desktop-artifacts:
    name: Desktop release artifacts
    needs: release
    if: needs.release.outputs.desktop_release == 'true'
    uses: ./.github/workflows/desktop-build.yml
    with:
      sign-macos: true
      retention-days: 7
      upload-artifact-prefix: kimi-code-app
    secrets:
      APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_NOTARIZATION_KEY_P8: ${{ secrets.APPLE_NOTARIZATION_KEY_P8 }}
      APPLE_NOTARIZATION_KEY_ID: ${{ secrets.APPLE_NOTARIZATION_KEY_ID }}
      APPLE_NOTARIZATION_ISSUER_ID: ${{ secrets.APPLE_NOTARIZATION_ISSUER_ID }}

  publish-desktop-assets:
    name: Publish desktop release assets
    needs:
      - release
      - desktop-artifacts
    if: needs.release.outputs.desktop_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release create / upload
    steps:
      # checkout 提供 git 上下文：gh release create --generate-notes 需要
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Download installer artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: kimi-code-app-*
          path: dist-desktop-release
          merge-multiple: true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Merge mac updater metadata (arm64 + x64)
        shell: bash
        run: |
          set -euo pipefail
          # 两个 mac leg 的 <channel>-mac-<arch>.yml（desktop-build.yml 里按
          # arch 改的名；channel 为 latest 或 alpha，随版本号推导）合并回单个
          # <channel>-mac.yml：files 含两个 arch 的包，electron-updater 按当前
          # arch 自选 zip；path/sha512 保留 arm64 兜底。
          # 纯仓内脚本、零第三方依赖（文本级合并，见脚本头注释）。
          node scripts/merge-mac-update-yml.mjs dist-desktop-release

      - name: Create GitHub Release and upload installers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release.outputs.desktop_release_tag }}
          RELEASE_SHA: ${{ needs.release.outputs.desktop_release_sha }}
          RELEASE_PRERELEASE: ${{ needs.release.outputs.desktop_release_prerelease }}
        run: |
          set -euo pipefail
          ls -la dist-desktop-release
          # tag 一并创建，钉在触发本次发版的 merge commit 上（而不是当时的
          # main HEAD——打包期间 main 可能已前移）。alpha 版本打 prerelease。
          prerelease_args=()
          if [ "$RELEASE_PRERELEASE" = "true" ]; then
            prerelease_args=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" \
            --target "$RELEASE_SHA" \
            --title "Kimi Code Desktop $RELEASE_TAG" \
            --generate-notes \
            ${prerelease_args[@]+"${prerelease_args[@]}"}
          gh release upload "$RELEASE_TAG" dist-desktop-release/* --clobber
