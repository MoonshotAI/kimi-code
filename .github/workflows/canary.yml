name: Canary
run-name: Canary (${{ inputs.trigger }}) · ${{ github.ref_name }}

# Builds a canary release of @moonshot-ai/kimi-code from the newest CI-green
# commit on main and publishes it as a GitHub prerelease (plus the npm
# `canary` dist-tag when enabled). Never touches the stable `latest` tag, the
# stable GitHub release, or the CDN: the CDN `channels/canary.json` pointer is
# written outside CI from the prerelease's canary.json asset.
#
# Dispatched nightly and on demand:
#   gh workflow run canary.yml --ref main -f trigger=nightly
#   gh workflow run canary.yml --ref main -f trigger=manual [-f force=true]

on:
  workflow_dispatch:
    inputs:
      trigger:
        description: 'Why this canary is built'
        type: choice
        options: [nightly, manual]
        default: manual
      force:
        description: 'Build even when the selected commit already has a canary'
        type: boolean
        default: false

concurrency:
  group: kimi-code-canary
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Control code (this workflow, scripts/canary-release.mjs, produce-manifest)
  # always runs from the dispatched revision. The selected commit is only
  # read as build input, so an older green commit that predates these
  # scripts still builds.
  prepare:
    if: github.repository_owner == 'MoonshotAI'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      skip: ${{ steps.select.outputs.skip }}
      sha: ${{ steps.select.outputs.sha }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      built_at: ${{ steps.version.outputs.built_at }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Select commit
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          CANARY_FORCE: ${{ inputs.force }}
        run: node scripts/canary-release.mjs select
      - name: Install dependencies
        if: steps.select.outputs.skip == 'false'
        run: pnpm install --frozen-lockfile
      - name: Compute version
        id: version
        if: steps.select.outputs.skip == 'false'
        env:
          SHA: ${{ steps.select.outputs.sha }}
        run: |
          git worktree add --detach "$RUNNER_TEMP/canary-source" "$SHA"
          node scripts/canary-release.mjs version "$RUNNER_TEMP/canary-source"

  native:
    name: Native canary artifact
    needs: prepare
    if: needs.prepare.outputs.skip == 'false'
    uses: ./.github/workflows/_native-build.yml
    with:
      upload-artifact-prefix: kimi-code-canary
      retention-days: 7
      sign-macos: true
      sign-windows: true
      sha: ${{ needs.prepare.outputs.sha }}
      version: ${{ needs.prepare.outputs.version }}
    secrets:
      APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_NOTARIZATION_KEY_P8: ${{ secrets.APPLE_NOTARIZATION_KEY_P8 }}
      APPLE_NOTARIZATION_KEY_ID: ${{ secrets.APPLE_NOTARIZATION_KEY_ID }}
      APPLE_NOTARIZATION_ISSUER_ID: ${{ secrets.APPLE_NOTARIZATION_ISSUER_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

  # Every step is safe to re-run with "Re-run failed jobs": the version comes
  # from prepare's outputs, an already published npm version is skipped, and
  # an existing (possibly draft) release gets its assets re-uploaded.
  publish:
    name: Publish canary
    needs: [prepare, native]
    if: needs.prepare.outputs.skip == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # npm Trusted Publishing (OIDC)
    env:
      CANARY_SHA: ${{ needs.prepare.outputs.sha }}
      CANARY_VERSION: ${{ needs.prepare.outputs.version }}
      CANARY_TAG: ${{ needs.prepare.outputs.tag }}
      CANARY_BUILT_AT: ${{ needs.prepare.outputs.built_at }}
      CANARY_TRIGGER: ${{ inputs.trigger }}
      CANARY_REF: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org

      # npm goes first so an existing prerelease always means every channel
      # is ready. Off until npmjs lists canary.yml as a trusted publisher for
      # the package; set the repository variable KIMI_CODE_CANARY_NPM_PUBLISH
      # to 'true' to turn it on. Same publish command as the stable release,
      # with the canary dist-tag instead of latest.
      - name: Check out selected commit for npm
        if: vars.KIMI_CODE_CANARY_NPM_PUBLISH == 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          path: canary-source
      - name: Publish to npm (canary dist-tag)
        if: vars.KIMI_CODE_CANARY_NPM_PUBLISH == 'true'
        working-directory: canary-source
        run: |
          if npm view "@moonshot-ai/kimi-code@$CANARY_VERSION" version >/dev/null 2>&1; then
            echo "@moonshot-ai/kimi-code@$CANARY_VERSION is already on npm"
            exit 0
          fi
          npm install -g npm@11
          pnpm install --frozen-lockfile
          (cd apps/kimi-code && npm pkg set version="$CANARY_VERSION")
          CATALOG_FILE="$RUNNER_TEMP/kimi-code-built-in-catalog.json"
          node apps/kimi-code/scripts/update-catalog.mjs --out "$CATALOG_FILE"
          export KIMI_CODE_BUILT_IN_CATALOG_FILE="$CATALOG_FILE"
          pnpm build
          cd apps/kimi-code
          pnpm publish --tag canary --access public --no-git-checks

      - name: Download native artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: kimi-code-canary-*
          path: dist-canary
          merge-multiple: true

      - name: Produce manifest.json
        run: node apps/kimi-code/scripts/native/produce-manifest.mjs dist-canary "$CANARY_TAG"

      - name: Write canary.json and release notes
        run: |
          mkdir -p "$RUNNER_TEMP/canary-notes"
          node scripts/canary-release.mjs record "$RUNNER_TEMP/canary-notes"
          cp "$RUNNER_TEMP/canary-notes/canary.json" dist-canary/canary.json

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="$RUNNER_TEMP/canary-notes/notes.md"
          if gh release view "$CANARY_TAG" >/dev/null 2>&1; then
            gh release upload "$CANARY_TAG" dist-canary/* --clobber
            gh release edit "$CANARY_TAG" --notes-file "$notes" --prerelease --latest=false --draft=false
          else
            gh release create "$CANARY_TAG" dist-canary/* \
              --target "$CANARY_SHA" \
              --title "$CANARY_TAG" \
              --notes-file "$notes" \
              --prerelease \
              --latest=false
          fi
