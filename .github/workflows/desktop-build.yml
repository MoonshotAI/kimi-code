name: desktop-build

# 桌面端（Electron）安装包流水线：macOS arm64/x64、Windows x64、Linux x64。
# 手动触发（Actions -> desktop-build -> Run workflow），产物只进 artifacts，
# 不做 Release / OSS 分发与自动更新。参考 kimi-code 仓库的同名 workflow。
#
# macOS 默认用 Developer ID 证书签名 + notarize；Run workflow 时把
# sign-macos 设为 false 可出未签名包。Windows / Linux 不签名
#（Windows 会弹 SmartScreen）。
#
# 需要的 secrets（Settings -> Secrets and variables -> Actions）：
#   APPLE_CERTIFICATE_P12          base64 编码的 Developer ID Application .p12
#   APPLE_CERTIFICATE_PASSWORD     .p12 导出密码
#   APPLE_NOTARIZATION_KEY_P8      base64 编码的 App Store Connect API Key (.p8)
#   APPLE_NOTARIZATION_KEY_ID      API Key ID
#   APPLE_NOTARIZATION_ISSUER_ID   Issuer ID (UUID)
on:
  workflow_dispatch:
    inputs:
      sign-macos:
        description: '签名 + 公证 macOS 包（需要 APPLE_* secrets）'
        required: false
        type: boolean
        default: true
      canary:
        description: 'Kimi Code Canary 内测构建：只打 macOS arm64，版本号改为 <base>-canary.<run_number>，发布 GitHub prerelease'
        required: false
        type: boolean
        default: false
      retention-days:
        description: 'Artifact 保留天数'
        required: false
        type: number
        default: 7
      upload-artifact-prefix:
        description: '上传的 artifact 名前缀'
        required: false
        type: string
        default: 'kimi-code-app'
  # release.yml 通过 workflow_call 调用本 workflow 打发版产物。
  workflow_call:
    inputs:
      sign-macos:
        required: false
        type: boolean
        default: false
      retention-days:
        required: false
        type: number
        default: 7
      upload-artifact-prefix:
        required: false
        type: string
        default: 'kimi-code-app'
    secrets:
      APPLE_CERTIFICATE_P12:
        required: false
      APPLE_CERTIFICATE_PASSWORD:
        required: false
      APPLE_NOTARIZATION_KEY_P8:
        required: false
      APPLE_NOTARIZATION_KEY_ID:
        required: false
      APPLE_NOTARIZATION_ISSUER_ID:
        required: false

permissions:
  contents: read

env:
  # 单一开关，供下方各步骤的 if / env 条件复用。
  SIGN_MACOS: ${{ inputs.sign-macos }}

jobs:
  # 动态矩阵：jobs.<id>.if 在 matrix 展开前求值、拿不到 matrix 上下文
  #（之前 job 级 if 引用 matrix.target 把整个文件判了无效，push 全是 0s
  # 幻影失败），所以平台过滤改走 fromJSON 动态矩阵。
  # canary 内测构建只打 macOS arm64（Apple Silicon；Kimi Code Canary 不支持
  # win/linux，内部也没有 Intel 机器）。
  matrix-source:
    name: matrix source
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.matrix.outputs.targets }}
    steps:
      - id: matrix
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.canary }}" = "true" ]; then
            echo 'targets=[{"os":"macos-15","target":"darwin-arm64"}]' >> "$GITHUB_OUTPUT"
          else
            echo 'targets=[{"os":"macos-15","target":"darwin-arm64"},{"os":"macos-15-intel","target":"darwin-x64"},{"os":"windows-2025","target":"win32-x64"},{"os":"ubuntu-24.04","target":"linux-x64"}]' >> "$GITHUB_OUTPUT"
          fi

  package:
    name: package (${{ matrix.target }})
    needs: matrix-source
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix-source.outputs.targets) }}

    steps:
      - name: Checkout (with kimi-code submodule)
        # desktop 经 workspace import kimi-code 的 packages 源码，必须拉
        # submodule；kimi-code 是公开仓，默认 GITHUB_TOKEN 即可。
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        # postinstall 会自动准备共享字体（prepare-fonts）并跑 electron-rebuild。
        run: pnpm install --frozen-lockfile

      - name: Setup macOS keychain (Developer ID)
        if: runner.os == 'macOS' && env.SIGN_MACOS == 'true'
        uses: ./.github/actions/macos-keychain-setup
        with:
          certificate-p12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          certificate-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Prepare CSC_NAME for electron-builder (macOS)
        if: runner.os == 'macOS' && env.SIGN_MACOS == 'true'
        shell: bash
        run: |
          # electron-builder 不认 CSC_NAME 里的 "Developer ID Application: "
          # 前缀，剥掉后按团队名 + Team ID 匹配证书。
          name="${APPLE_SIGNING_IDENTITY}"
          name="${name#Developer ID Application: }"
          echo "CSC_NAME=$name" >> "$GITHUB_ENV"

      - name: Prepare notarization API key (macOS)
        if: runner.os == 'macOS' && env.SIGN_MACOS == 'true'
        shell: bash
        env:
          APPLE_NOTARIZATION_KEY_P8: ${{ secrets.APPLE_NOTARIZATION_KEY_P8 }}
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/notary-AuthKey.p8"
          printf '%s' "$APPLE_NOTARIZATION_KEY_P8" | base64 -d > "$key_path"
          echo "APPLE_API_KEY=$key_path" >> "$GITHUB_ENV"

      - name: Stamp canary version (canary builds)
        # Kimi Code Canary 内测构建：把版本号临时改为 <base>-canary.<run_number>
        #（不回填仓库），产物文件名与 app.getVersion() 都带 canary 后缀，
        # 用户能直接认出内测版；运行时也据此判定 canary 身份
        #（apps/desktop/src/main/canary.ts 的 isCanaryVersion）。
        if: inputs.canary
        shell: bash
        run: |
          set -euo pipefail
          node -e "
            const fs = require('fs');
            const p = 'apps/desktop/package.json';
            const pkg = JSON.parse(fs.readFileSync(p, 'utf8'));
            pkg.version = pkg.version.split('-')[0] + '-canary.${{ github.run_number }}';
            fs.writeFileSync(p, JSON.stringify(pkg, null, 2) + '\n');
            console.log('canary version:', pkg.version);
          "

      - name: Build & package desktop app
        shell: bash
        env:
          # macOS 签名由 env 驱动：sign-macos 时 electron-builder 用 keychain
          # 里的 Developer ID 签名并经 notary API key 公证，否则出未签名包。
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ (runner.os == 'macOS' && env.SIGN_MACOS == 'true') && 'true' || 'false' }}
          CSC_KEYCHAIN: ${{ env.APPLE_KEYCHAIN_PATH }}
          KIMI_DESKTOP_NOTARIZE: ${{ (runner.os == 'macOS' && env.SIGN_MACOS == 'true') && 'true' || 'false' }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_NOTARIZATION_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_NOTARIZATION_ISSUER_ID }}
          # canary=true 时 electron-builder 切到 Kimi Code Canary 身份
          #（独立 appId/productName/黄图标，electron-builder.config.cjs）。
          KIMI_DESKTOP_CANARY: ${{ inputs.canary && 'true' || 'false' }}
        run: pnpm --filter kimi-code-app run dist

      - name: Rename mac updater metadata per arch (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          # 两个 mac leg 各自产出 <channel>-mac.yml（channel 随版本号推导：
          # 正式版 latest，预发版如 0.0.x-alpha.N 为 alpha），release.yml 合并
          # 下载 artifact 时同名文件 last-writer-wins，会丢掉一个 arch 的更新
          # feed。这里按 arch 改名避让；release.yml 发布前再把两份合并回单个
          # <channel>-mac.yml（electron-updater 在 files 列表里按 arch 自选 zip）。
          cd apps/desktop/dist-app
          arch="${{ matrix.target }}"
          arch="${arch##*-}"
          channel_yml=$(ls *-mac.yml)
          channel="${channel_yml%-mac.yml}"
          mv "$channel_yml" "${channel}-mac-${arch}.yml"

      - name: Cleanup macOS keychain
        if: always() && runner.os == 'macOS' && env.SIGN_MACOS == 'true'
        uses: ./.github/actions/macos-keychain-cleanup

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.upload-artifact-prefix }}-${{ matrix.target }}
          retention-days: ${{ inputs.retention-days }}
          path: |
            apps/desktop/dist-app/*.dmg
            apps/desktop/dist-app/*.zip
            apps/desktop/dist-app/*.exe
            apps/desktop/dist-app/*.AppImage
            apps/desktop/dist-app/*.deb
            # electron-updater 元数据（latest*.yml + 差分用的 blockmap），
            # 自动更新与 CDN 发布（publish-desktop.sh）都依赖它们。
            apps/desktop/dist-app/*.yml
            apps/desktop/dist-app/*.blockmap
          if-no-files-found: ignore

  # Kimi Code Canary 内测发布：canary=true 时把 macOS 产物以 GitHub prerelease
  # 形式发布（tag v<base>-canary.<run_number>）。canary 通道不走 CDN /
  # latest*.yml 指针，客户端经本地 gh CLI 查 prerelease 并手动下载
  #（见 apps/desktop/docs/canary.md）。
  publish-canary:
    name: Publish canary prerelease
    needs: package
    if: inputs.canary
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release create / upload
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Download installer artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: kimi-code-app-*
          path: dist-desktop-canary
          merge-multiple: true

      - name: Create GitHub prerelease and upload installers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base="$(node -p "require('./apps/desktop/package.json').version.split('-')[0]")"
          version="${base}-canary.${{ github.run_number }}"
          tag="v${version}"
          echo "==> canary tag: ${tag}"
          ls -la dist-desktop-canary
          gh release create "$tag" \
            --target "${GITHUB_SHA}" \
            --title "Kimi Code Canary ${version}" \
            --notes "Kimi Code Canary 内部内测构建，使用说明见 apps/desktop/docs/canary.md。" \
            --prerelease
          gh release upload "$tag" dist-desktop-canary/* --clobber
