[package]
name = "kimi-sdk"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Kimi Code client SDK — high-level harness over the host protocol (stage E: node-sdk/klient surface)"

[dependencies]
anyhow = "1"
base64 = "0.22"
kimi-agent = { path = "../../packages/kimi-agent" }
kimi-oauth = { path = "../kimi-oauth" }
kimi-protocol = { path = "../kimi-protocol" }
kimi-server = { path = "../kimi-server" }
kimi-server-client = { path = "../kimi-server-client" }
kimi-ui = { path = "../kimi-ui" }
reqwest = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true }
