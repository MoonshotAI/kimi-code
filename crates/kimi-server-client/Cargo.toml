[package]
name = "kimi-server-client"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Kimi Code host protocol client — AppServerClient{InProcess, Remote} (layer 3 of the Rust-first migration)"

[dependencies]
anyhow = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
kimi-protocol = { path = "../kimi-protocol" }
kimi-server = { path = "../kimi-server" }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["net"] }
tokio-tungstenite = "0.24"
