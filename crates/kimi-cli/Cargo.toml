[package]
name = "kimi-cli"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Kimi Code command dispatcher (layer 4 of the Rust-first migration)"

[[bin]]
name = "kimi"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { workspace = true }
kimi-agent = { path = "../../packages/kimi-agent" }
kimi-exec = { path = "../kimi-exec" }
kimi-protocol = { path = "../kimi-protocol" }
kimi-server = { path = "../kimi-server" }
kimi-server-client = { path = "../kimi-server-client" }
kimi-acp = { path = "../kimi-acp" }
kimi-sdk = { path = "../kimi-sdk" }
kimi-tui = { path = "../kimi-tui" }
kimi-ui = { path = "../kimi-ui" }
serde_json = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
