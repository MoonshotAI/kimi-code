[package]
name = "kimi-server-transport"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Kimi Code host protocol transports — stdio/unix-socket/websocket (layer 3 of the Rust-first migration)"

[dependencies]
anyhow = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
kimi-protocol = { path = "../kimi-protocol" }
kimi-server = { path = "../kimi-server" }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["net"] }
tokio-tungstenite = "0.24"

[dev-dependencies]
kimi-server-client = { path = "../kimi-server-client" }
