[package]
name = "kimi-server-transport"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Kimi Code host protocol transports — stdio/unix-socket/websocket (layer 3 of the Rust-first migration)"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
kimi-oauth = { path = "../kimi-oauth" }
kimi-protocol = { path = "../kimi-protocol" }
kimi-server = { path = "../kimi-server" }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["net"] }
tokio-tungstenite = "0.24"
tower-http = { version = "0.6", features = ["fs"] }

[dev-dependencies]
kimi-server-client = { path = "../kimi-server-client" }
reqwest = { workspace = true }
