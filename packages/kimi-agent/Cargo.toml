[package]
name = "kimi-agent"
version = "0.1.0"
edition = "2024"
description = "Kimi Agent engine (Rust) — stateless turn loop, napi-rs native addon"

[features]
default = []
napi = ["dep:napi", "dep:napi-derive"]

[lib]
crate-type = ["cdylib", "rlib"]
name = "kimi_agent"

[[bin]]
name = "kimi-agent-cli"
path = "src/main.rs"

[dependencies]
napi = { version = "2", features = ["async", "tokio_rt", "napi8", "serde"], optional = true }
napi-derive = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
fastrand = "2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "io-util", "io-std", "process", "time", "net"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls", "gzip", "json"] }
eventsource-stream = "0.2"
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
globset = "0.4"
hex = "0.4"
ignore = "0.4"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
kimi-shared = { path = "../kimi-shared" }
image = { workspace = true }
toml = "0.8"
zip = "0.6"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }

[build-dependencies]
napi-build = "2"

[dev-dependencies]
serde_json = "1"
tempfile = "3"
futures = "0.3"