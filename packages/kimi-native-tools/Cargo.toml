[package]
name = "kimi-native-tools"
version = "0.1.0"
edition = "2021"
description = "Native Rust tools for Kimi Code — bash, grep, glob, read, write, edit"

[lib]
crate-type = ["cdylib", "rlib"]
name = "kimi_native_tools"

[dev-dependencies]
criterion = "0.5"
tempfile = "3"

[[bench]]
name = "native_tools_bench"
harness = false

[dependencies]
napi = { version = "2", features = ["async", "napi8", "serde"] }
napi-derive = "2"
regex = "1"
globset = "0.4"
ignore = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "io-util", "process", "time"] }
encoding_rs = "0.8"
memchr = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
ureq = { version = "2", features = ["json"] }
scraper = "0.22"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls", "gzip"] }
futures-util = "0.3"
eventsource-stream = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
ulid = "1"
chrono = "0.4"
once_cell = "1"
sha2 = "0.10"

[build-dependencies]
napi-build = "2"