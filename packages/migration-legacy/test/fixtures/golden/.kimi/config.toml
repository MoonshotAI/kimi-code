default_model = "golden-main"
default_thinking = false
default_yolo = false
skip_afk_prompt_injection = false
default_plan_mode = false
default_editor = "code --wait"
theme = "dark"
show_thinking_stream = true
merge_all_available_skills = true
extra_skill_dirs = ["/work/extra-skills"]
telemetry = true

[models.golden-main]
provider = "managed:kimi-code"
model = "kimi-for-coding"
max_context_size = 262144
capabilities = ["thinking", "image_in"]

[models.vllm-mooncake]
provider = "vllm"
model = "mooncake-v1"
max_context_size = 131072

[providers."managed:kimi-code"]
type = "kimi"
base_url = "https://api.example.test/coding/v1"
api_key = "sk-golden-managed"

[providers."managed:kimi-code".oauth]
storage = "file"
key = "oauth/kimi-code"

[providers.vllm]
type = "openai_legacy"
base_url = "https://vllm.example.test/v1"
api_key = "EMPTY"
reasoning_key = "reasoning"

[providers.genai]
type = "google_genai"
base_url = "https://genai.example.test/v1beta"
api_key = "sk-golden-genai"

[providers.vx]
type = "vertexai"
base_url = "https://vx.example.test/v1"
api_key = "sk-golden-vx"

[loop_control]
max_steps_per_turn = 1000
max_retries_per_step = 5
max_ralph_iterations = 0
reserved_context_size = 60000
compaction_trigger_ratio = 0.85

[background]
max_running_tasks = 4
read_max_bytes = 30000
notification_tail_lines = 20
notification_tail_chars = 3000
wait_poll_interval_ms = 500
worker_heartbeat_interval_ms = 5000
worker_stale_after_ms = 15000
kill_grace_period_ms = 2000
keep_alive_on_exit = false
agent_task_timeout_s = 900
print_wait_ceiling_s = 3600

[notifications]
claim_stale_after_ms = 15000

[services]

[mcp.client]
tool_call_timeout_ms = 60000

[[hooks]]
event = "PreToolUse"
command = "echo golden-hook"
matcher = "Shell"
timeout = 30
