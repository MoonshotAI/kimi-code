<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="64x64" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)" />
    <!-- Apply persisted display prefs BEFORE the bundle loads: without this,
         users can get a color-scheme/font flash before useKimiWebClient mirrors
         the data attributes. Mirrors applyColorSchemeToDocument and
         useAppearance's font-scale migration (retired 'xxlarge' → 'xlarge';
         legacy px key → nearest step). -->
    <script>
      (function () {
        try {
          var v = localStorage.getItem('kimi-web.color-scheme');
          if (v === 'light' || v === 'dark' || v === 'system') {
            document.documentElement.dataset.colorScheme = v;
          }
          var fs = localStorage.getItem('kimi-web.font-scale');
          if (fs === 'xxlarge') fs = 'xlarge';
          if (fs !== 'small' && fs !== 'medium' && fs !== 'large' && fs !== 'xlarge') {
            var legacy = localStorage.getItem('kimi-web.ui-font-size');
            var px = Number(legacy);
            fs =
              legacy !== null && isFinite(px)
                ? px <= 13
                  ? 'small'
                  : px <= 15
                    ? 'medium'
                    : px <= 17
                      ? 'large'
                      : 'xlarge'
                : 'medium';
          }
          document.documentElement.dataset.fontScale = fs;
        } catch (e) {
          /* ignore */
        }
      })();
    </script>
    <title>Kimi Code</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
